<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adelaide Metro House Prices</title>
    <meta name="description" content="Self-updating dashboard of Adelaide metropolitan median house prices and sales by suburb and council, from SA Government open data." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23184f95'/><path d='M7 17 16 9l9 8v8h-6v-5h-6v5H7z' fill='white'/></svg>" />
    <script>
      try {
        var u = new URLSearchParams(location.search).get('theme');
        if (u === 'light' || u === 'dark') localStorage.setItem('theme', u);
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
